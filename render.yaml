envVarGroups:
  - name: web-app-blueprint-node
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
  - name: web-app-blueprint-shared
    envVars:
      # Optional integrations stay disabled until configured in the Render Dashboard.
      # Omit values so later Blueprint syncs preserve dashboard-managed settings.
      - key: LETTERMINT_API_KEY
      - key: LETTERMINT_MAIL_FROM
      - key: SENTRY_DSN
      - key: SENTRY_PUBLIC_DSN
      - key: SENTRY_ENVIRONMENT
      - key: SENTRY_RELEASE
      - key: SENTRY_TRACES_SAMPLE_RATE
      - key: SENTRY_REPLAYS_SESSION_SAMPLE_RATE
      - key: SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE

services:
  - type: keyvalue
    name: web-app-blueprint-queue
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: web-app-blueprint-storage
    runtime: image
    plan: starter
    region: frankfurt
    image:
      url: docker.io/chrislusf/seaweedfs:4.50
    dockerCommand: >-
      /entrypoint.sh mini -dir=/data -s3.port=8333
      -webdav=false -admin.ui=false
      -s3.port.iceberg=0 -s3.port.lance=0
    disk:
      name: objectdata
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8333"
      - key: AWS_ACCESS_KEY_ID
        # Don't use generateValue here: it can contain a "/", which is used as a separator.
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: RENDER_SERVICE_ID
      - key: AWS_SECRET_ACCESS_KEY
        generateValue: true
      - key: AWS_DEFAULT_REGION
        value: eu-central-1
      - key: S3_BUCKET
        value: blueprint-files
      - key: WEED_S3_ALLOWEDORIGINS
        fromService:
          type: web
          name: web-app-blueprint-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: web-app-blueprint-web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build:web
    preDeployCommand: npm run db:migrate
    startCommand: npm run start:web
    envVars:
      - fromGroup: web-app-blueprint-node
      - fromGroup: web-app-blueprint-shared
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: RATE_LIMIT_KEY_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: web-app-blueprint-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: web-app-blueprint-queue
          property: connectionString
      - key: APP_URL
        fromService:
          type: web
          name: web-app-blueprint-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: S3_REGION
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: AWS_DEFAULT_REGION
      - key: S3_BUCKET
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: S3_BUCKET
      - key: S3_ENDPOINT
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: RENDER_EXTERNAL_URL
      - key: S3_PUBLIC_ENDPOINT
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: RENDER_EXTERNAL_URL
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: AWS_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: AWS_SECRET_ACCESS_KEY

  - type: worker
    name: web-app-blueprint-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build:worker
    startCommand: npm run start:worker
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: web-app-blueprint-node
      - fromGroup: web-app-blueprint-shared
      - key: DATABASE_URL
        fromDatabase:
          name: web-app-blueprint-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: web-app-blueprint-queue
          property: connectionString
      - key: APP_URL
        fromService:
          type: web
          name: web-app-blueprint-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: S3_REGION
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: AWS_DEFAULT_REGION
      - key: S3_BUCKET
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: S3_BUCKET
      - key: S3_ENDPOINT
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: RENDER_EXTERNAL_URL
      - key: S3_PUBLIC_ENDPOINT
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: RENDER_EXTERNAL_URL
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: AWS_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: web-app-blueprint-storage
          envVarKey: AWS_SECRET_ACCESS_KEY

databases:
  - name: web-app-blueprint-db
    plan: basic-256mb
    region: frankfurt
